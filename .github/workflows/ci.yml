name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hygiene:
    name: Repository checks on the PC
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Repository hygiene (no third-party media, help lines, error identifiers)
        run: python3 scripts/validation/check_repo.py
      - name: Shell helpers parse
        run: bash -n scripts/run_tests.sh && bash -n scripts/check_environment.sh

  matlab:
    name: ${{ matrix.os }} · simulate, draw, test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Virtual display for the app and figure tests (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: latest
          cache: true

      - name: Path, environment report and the worked examples
        uses: matlab-actions/run-command@v2
        with:
          command: |
            setup;
            out = rigid_body_examples('Quiet', true);
            assert(out.dice.summary.settled, 'the thrown die did not settle');
            assert(out.fourbar.summary.maxClosureResidual < 1e-12, 'four-bar loop did not close');

      - name: Test suite
        uses: matlab-actions/run-command@v2
        with:
          command: setup test

      - name: Figures regenerate and match what is committed
        if: runner.os == 'Linux'
        uses: matlab-actions/run-command@v2
        with:
          command: setup figures
